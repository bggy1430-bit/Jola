name: Fix pet descriptions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove incorrect defense wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "방어력이 260% 증가합니다. 또한 적의 세 번째 공격마다 그 공격으로 받는 피해가 45% 감소합니다. 방어력 증가와 받는 피해 감소가 각각의 방어 계산 단계에서 적용됩니다.": "적의 세 번째 공격마다 그 공격으로 받는 피해가 45% 감소합니다. 이 효과는 공격을 막는 것이 아니라 해당 공격의 실제 피해량을 45% 줄입니다.",
              "방어력이 250% 증가합니다. 플레이어 체력이 최대 체력의 50% 이하가 되면 받는 피해가 추가로 40% 감소합니다. 방어력 증가와 별도의 받는 피해 감소 효과가 함께 적용됩니다.": "플레이어 체력이 최대 체력의 50% 이하가 되면 받는 피해가 추가로 40% 감소합니다. 체력 조건이 충족될 때만 추가 감소가 적용됩니다.",
              "방어력이 300% 증가합니다. 동시에 적에게서 받는 모든 피해가 20% 감소합니다. 방어력 증가와 별도의 받는 피해 감소 효과가 함께 적용됩니다.": "적에게서 받는 모든 피해가 20% 감소합니다. 이 효과는 적의 공격 자체를 없애는 것이 아니라 실제로 받는 피해량을 줄입니다.",
              "추가로 플레이어 최대 체력과 방어력이 각각 80% 증가합니다. 피해 흡수는 확률에 의존하지 않습니다.": "추가로 플레이어의 최대 체력이 80% 증가합니다. 피해 흡수는 확률에 의존하지 않습니다."
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html
          git diff --cached --quiet || git commit -m "fix: 태초 펫 설명에서 방어력 문구 제거"
          git push
      - name: Remove this workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-pet-descriptions.yml || true
          git commit -m "chore: remove temporary description fix workflow" || true
          git push || true
