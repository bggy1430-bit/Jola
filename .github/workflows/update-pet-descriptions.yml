name: 펫 설명 상세화

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[설명자동수정완료]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 펫 설명 변경
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')

          updates = {
            'pet_dog': '새로운 몬스터와 전투를 시작한 뒤 첫 번째 공격을 할 때, 플레이어의 기본 공격 피해량이 25% 증가합니다. 이 효과는 직접 피해를 추가하는 것이 아니라 플레이어 기본 공격 자체의 피해량을 증가시키는 효과입니다.',
            'pet_fox': '치명타 확률이 6% 증가합니다. 치명타가 발생했을 때의 피해 계산은 현재 플레이어의 치명타 피해 계산 방식을 그대로 따릅니다.',
            'pet_sloth': '적의 세 번째 공격을 받을 때마다 그 공격으로 받는 피해가 35% 감소합니다. 적의 공격을 직접 무효화하는 효과가 아니라, 실제로 들어오는 피해량을 감소시키는 방어 효과입니다.',
            'pet_pig': '잡동사니 아이템을 판매했을 때 얻는 판매 금액이 18% 증가합니다. 전투 피해에는 직접 영향을 주지 않습니다.',
            'pet_wolf': '세 번째 플레이어 공격마다 공격력의 120%에 해당하는 피해를 별도의 추가 타격으로 한 번 더 가합니다. 이 추가 타격은 일반 공격 피해와 별도로 계산되며, 스테이지가 바뀌면 공격 횟수가 초기화됩니다.',
            'pet_turtle': '모든 적의 공격으로 플레이어가 실제로 받는 피해를 18% 감소시킵니다. 플레이어의 방어력을 직접 올리는 효과와는 별개로, 최종적으로 받는 피해를 줄이는 효과입니다.',
            'pet_owl': '전투에서 얻는 경험치가 15% 증가합니다. 공격 피해에는 직접 영향을 주지 않습니다.',
            'pet_panda': '플레이어가 적에게 피해를 가할 때, 가한 피해량의 2%만큼 플레이어의 체력을 회복합니다. 피해를 추가하는 효과가 아니라 피해량을 기준으로 회복량을 계산하는 효과입니다.',
            'pet_panther': '네 번째 플레이어 공격마다 공격력의 30%에 해당하는 피해를 별도의 추가 타격으로 한 번 더 가합니다. 일반 공격과 별개의 타격으로 처리되며, 스테이지가 바뀌면 공격 횟수가 초기화됩니다.',
            'pet_dragon_baby': '공격할 때 24% 확률로 적의 최대 체력 4%에 해당하는 피해를 추가로 가합니다. 이 피해는 적의 최대 체력을 기준으로 계산되며, 보스에게는 최대 체력의 1.5%만 적용됩니다. 플레이어 공격력에 비례하는 일반 피해와는 별도로 계산됩니다.',
            'pet_lion': '보스를 공격할 때 플레이어가 가하는 피해가 22% 증가합니다. 일반 몬스터에게는 적용되지 않으며, 별도의 추가 타격을 발생시키는 효과가 아니라 보스 대상 플레이어 피해를 증가시키는 효과입니다.',
            'pet_eagle': '세 번째 플레이어 공격마다 공격력의 22%에 해당하는 피해를 별도의 추가 타격으로 한 번 더 가합니다. 일반 공격과 따로 계산되며, 스테이지가 바뀌면 공격 횟수가 초기화됩니다.',
            'pet_frost_mimic': '전투에서 처음 받는 적의 공격과 그 이후 여섯 번째 적 공격마다 해당 공격으로 받는 피해가 70% 감소합니다. 공격을 완전히 막는 것이 아니라 해당 공격의 실제 피해량을 크게 줄이는 효과입니다.',
            'pet_treasure_goblin': '몬스터를 처치했을 때 18% 확률로 해당 처치에서 얻는 골드가 3배가 됩니다. 전투 피해 계산에는 영향을 주지 않습니다.',
            'pet_berserk_hamster': '플레이어의 체력이 최대 체력의 30% 이하가 되면 플레이어의 기본 공격 피해가 18% 증가합니다. 별도의 추가 타격을 만드는 효과가 아니라 기본 공격 피해량을 강화하는 효과입니다.',
            'pet_mirror_fox': '적의 다섯 번째 공격을 받을 때 해당 공격으로 받는 피해가 70% 감소하고, 이어지는 다음 플레이어 공격의 피해가 70% 증가합니다. 두 효과는 각각 받는 피해 감소와 다음 공격 강화로 따로 계산됩니다.',
            'myth_iron_dragon': '플레이어의 공격력이 75% 증가합니다. 직접 추가 피해를 발생시키는 능력이 아니라 플레이어의 공격력 능력치를 증가시키는 능력입니다.',
            'myth_guardian': '플레이어의 방어력이 95% 증가합니다. 적의 공격을 직접 무효화하는 확률 효과가 아니라 방어력 능력치를 높여 받는 피해 계산에 영향을 줍니다.',
            'myth_world_tree': '플레이어의 최대 체력이 120% 증가합니다. 최대 체력을 기준으로 계산되는 피해와 회복 효과가 있다면 증가한 최대 체력이 기준이 됩니다.',
            'myth_sky_emperor': '치명타 피해가 100% 증가합니다. 치명타가 발생했을 때 적용되는 피해량을 강화하며, 치명타가 아닌 일반 공격의 피해에는 직접 적용되지 않습니다.',
            'myth_fate_book': '전투에서 얻는 경험치가 80% 증가합니다. 전투 피해 계산에는 직접 영향을 주지 않습니다.',
            'myth_treasure_god': '몬스터 처치 등으로 얻는 골드 획득량이 130% 증가합니다. 전투 피해 계산에는 직접 영향을 주지 않습니다.',
            'origin_meteor': '방어력이 260% 증가합니다. 또한 적의 세 번째 공격마다 그 공격으로 받는 피해가 45% 감소합니다. 방어력 증가와 받는 피해 감소가 각각의 방어 계산 단계에서 적용됩니다.',
            'origin_time': '방어력이 240% 증가합니다. 적의 네 번째 공격을 받을 때마다 다음에 받는 피해가 70% 감소합니다. 공격을 완전히 막는 것이 아니라 해당 공격의 피해량을 감소시키는 효과입니다.',
            'origin_void': '방어력이 1000% 증가합니다. 또한 피해를 체력으로 적용하는 과정에서 별도의 피해 상한을 두지 않는 특수 방어 효과를 가집니다. 피해를 공격력으로 직접 증가시키는 능력은 아닙니다.',
            'origin_soul': '방어력이 230% 증가합니다. 적에게 공격받을 때마다 플레이어 최대 체력의 3%를 회복합니다. 회복량은 현재 체력이 아니라 최대 체력을 기준으로 계산됩니다.',
            'origin_chaos': '방어력이 250% 증가합니다. 플레이어 체력이 최대 체력의 50% 이하가 되면 받는 피해가 추가로 40% 감소합니다. 체력 조건이 충족될 때만 추가 감소가 적용됩니다.',
            'origin_star': '방어력이 300% 증가합니다. 동시에 적에게서 받는 모든 피해가 20% 감소합니다. 방어력 증가와 별도의 받는 피해 감소 효과가 함께 적용됩니다.',
            'absolute_void': '같은 적을 연속으로 공격할 때마다 직접 가하는 펫 피해가 25%씩 증가하며 최대 10번까지 중첩됩니다. 10중첩에 도달한 뒤 다음 공격에서는 플레이어가 가한 피해의 1000%에 해당하는 추가 펫 피해를 직접 가합니다. 이 추가 피해는 플레이어의 기본 공격과 별도의 피해로 처리됩니다.',
            'absolute_executioner': '적의 체력이 30% 이하가 되었을 때 플레이어가 가한 피해의 1000%를 별도의 고정 피해로 추가합니다. 이 고정 피해는 공격력 증가, 보스 대상 피해 증가, 펫 피해 증가 등의 추가 배율을 다시 적용받지 않습니다.',
            'absolute_barrage': '플레이어의 두 번째 공격마다 플레이어가 가한 피해의 60%를 추가 타격으로 여섯 번 발생시킵니다. 각 추가 타격은 원래 공격과 별개의 피해로 계산되며, 한 번의 공격에서 발생한 추가 타격끼리 피해가 합쳐지지 않습니다.',
            'absolute_crit': '플레이어가 가하는 공격 피해의 50%를 저장합니다. 저장량이 플레이어 최대 체력의 100%에 도달하면 저장된 피해량의 100%를 직접 펫 피해로 한 번에 방출합니다. 최대 저장량을 넘는 피해는 저장되지 않고 버려집니다.',
            'pet_zero': '제로 전용 연속 공격 효과입니다. 첫 번째부터 다섯 번째 공격까지 각각 서로 다른 직접 펫 피해와 회복 효과가 순서대로 발동하며, 적에게 공격받아도 현재 연속 공격 횟수가 끊기지 않습니다. 이 능력으로 발생하는 피해는 일반 플레이어 공격과 별도의 펫 피해로 처리됩니다.',
            'zero1': '플레이어가 직접 가한 공격만 복제합니다. 첫 번째 복제는 100% 확률로 발생하며 복제 피해는 원래 공격 피해의 70%입니다. 이후 복제가 이어질 때마다 발동 확률이 10%씩 감소합니다. 복제된 공격은 원래 플레이어 공격과 합쳐지지 않고 별도의 펫 피해로 기록됩니다.',
            'alpha_zero': '치명적인 피해를 처음 받을 때 그 피해를 완전히 무효화하고, 전투가 시작됐을 때의 체력으로 되돌립니다. 동시에 전투 중 적용된 해로운 효과를 제거합니다. 이 효과는 한 전투에서 한 번만 발동합니다.',
            'zero999': '치명적인 피해를 받을 상황이 되면 총 아홉 번의 연속 공격을 가합니다. 첫 번째부터 여덟 번째 공격은 각각 적 최대 체력의 1%와 플레이어 공격력의 10%를 합산해 계산하고, 아홉 번째 공격은 적 최대 체력의 5%와 플레이어 공격력의 300%를 합산해 계산합니다. 최대 체력에 비례하는 피해와 공격력에 비례하는 피해를 함께 사용하는 제로999 전용 공격입니다.',
            'zeroOmega': '적에게서 받는 피해의 40%를 확정적으로 흡수해 저장합니다. 다음 일반 공격을 할 때 저장한 피해량의 200%를 직접 펫 피해로 반사합니다. 추가로 플레이어 최대 체력과 방어력이 각각 80% 증가합니다. 피해 흡수는 확률에 의존하지 않습니다.',
            'error': '플레이어의 일반 직접 공격에만 반응해 공격력의 100%에 해당하는 고정 피해를 추가합니다. 이 추가 피해는 적의 방어력과 치명타 계산을 무시하며, 일반 플레이어 공격과 별도의 피해로 처리됩니다. 제로999의 아홉 번 연속 공격에는 반응하지 않습니다.'
          }

          for pid, desc in updates.items():
              pattern = rf"(\{{[^\n]*id:'{re.escape(pid)}'[^\n]*?desc:')[^']*(')"
              s, n = re.subn(pattern, lambda m, d=desc: m.group(1) + d.replace("'", "\\'") + m.group(2), s, count=1)
              if n != 1:
                  print(f'경고: {pid}: {n}개 변경')

          p.write_text(s, encoding='utf-8')
          PY
      - name: 변경사항 저장
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www/index.html
          if git diff --cached --quiet; then
            echo '변경할 설명이 없습니다.'
            exit 0
          fi
          git commit -m '펫 설명 상세화 [설명자동수정완료]'
          git push
